name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        run: |
          rustup install stable
          rustup default stable
      
      - name: Download Wintun DLL
        run: |
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip wintun.zip -d wintun
          # فقط DLL مورد نیاز (amd64) را در کنار کدهای ویندوز قرار بده
          mkdir -p windows/deps
          copy wintun\wintun\bin\amd64\wintun.dll windows\deps\
          # همچنین در ریشه پروژه برای دسترسی آسان
          copy wintun\wintun\bin\amd64\wintun.dll .
      
      - name: Build Windows App (Release)
        working-directory: ./windows
        run: cargo build --release --verbose
        env:
          # اگر برنامه نیاز به دانستن مسیر DLL دارد
          WINTUN_DLL_PATH: ./deps/wintun.dll
      
      - name: Get short SHA
        id: version
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
      - name: Upload EXE and DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iranvpn-windows-${{ steps.version.outputs.short_sha }}
          path: |
            ./windows/target/release/iranvpn.exe
            ./windows/deps/wintun.dll
            ./wintun.dll
          retention-days: 30
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_id }}
          name: Windows Build (Commit ${{ steps.version.outputs.short_sha }})
          body: |
            **فایل اجرایی ویندوز (آزمایشی)**
            
            - این بیلد خودکار توسط گیت‌هاب اکشن انجام شده است.
            - فایل `iranvpn.exe` به همراه `wintun.dll` (نسخه amd64) ارائه می‌شود.
            - **نحوه استفاده:** هر دو فایل را در یک پوشه提取 کرده و `iranvpn.exe` را اجرا کنید.
            - **هشدار:** نرم‌افزار تست‌نشده است. استفاده صرفاً برای اهداف تحقیقاتی.
          files: |
            ./windows/target/release/iranvpn.exe
            ./wintun.dll
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
